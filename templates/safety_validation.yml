---
name: safety_validation
description: Full safety validation suite for robot deployment certification
robot: configurable
inputs:
  urdf_path: required
  workspace_limits: required
  max_velocity: 1.0
  payload_range: [0, 10]
  safety_zones:
    warning: 0.5
    critical: 0.2
steps:
  - id: 1
    skill: isaac_setup
    method: load_urdf
    params:
      urdf_path: "{urdf_path}"
  - id: 2
    skill: isaac_setup
    method: configure_physics
    params:
      dt: 0.004167
      gravity: -9.81
  - id: 3
    skill: safety_testing
    method: workspace_boundary_test
    params:
      limits: "{workspace_limits}"
  - id: 4
    skill: safety_testing
    method: collision_detection_test
    params:
      obstacles: auto-detect
  - id: 5
    skill: safety_testing
    method: emergency_stop_test
  - id: 6
    skill: safety_testing
    method: payload_limit_test
    params:
      payload_range: "{payload_range}"
  - id: 7
    skill: safety_testing
    method: velocity_limit_test
    params:
      max_velocity: "{max_velocity}"
  - id: 8
    skill: safety_testing
    method: human_proximity_test
    params:
      safety_zones: "{safety_zones}"
  - id: 9
    skill: safety_testing
    method: generate_safety_report
output:
  - results/safety_report.md
