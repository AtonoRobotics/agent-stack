---
name: sim_to_real_transfer
description: Complete sim-to-real policy transfer pipeline
robot: configurable
inputs:
  policy_path: required
  robot_config: required
  n_randomized_envs: 100
  test_tasks: required
steps:
  - id: 1
    skill: sim_to_real
    method: domain_randomization
    params:
      n_environments: "{n_randomized_envs}"
  - id: 2
    skill: isaac_lab
    method: evaluate_rl_policy
    params:
      policy: "{policy_path}"
      n_episodes: 50
  - id: 3
    skill: sim_to_real
    method: reality_gap_benchmark
    params:
      sim_policy: "{policy_path}"
  - id: 4
    skill: sim_to_real
    method: transfer_policy
    params:
      sim_policy: "{policy_path}"
      real_robot: "{robot_config}"
    requires_approval: true
  - id: 5
    skill: sim_to_real
    method: validate_transfer
    params:
      test_tasks: "{test_tasks}"
  - id: 6
    skill: analysis
    method: generate_analysis_report
output:
  - results/sim_to_real_report.md
  - results/gap_analysis.json
