---
name: groot_data_collection
description: GR00T training data collection and preparation pipeline
robot: configurable
inputs:
  urdf_path: required
  n_samples: 1000
  task_description: required
  training_machine: dgx-spark
steps:
  - id: 1
    skill: isaac_setup
    method: load_urdf
    params:
      urdf_path: "{urdf_path}"
  - id: 2
    skill: isaac_setup
    method: configure_physics
  - id: 3
    skill: environment_builder
    method: create_environment
    params:
      config: default_tabletop
  - id: 4
    skill: sensor_setup
    method: add_camera
    params:
      type: rgb_depth
      position: [0.5, 0, 0.5]
      resolution: [640, 480]
      fps: 30
  - id: 5
    skill: groot_data
    method: generate_trajectory_dataset
    params:
      n_samples: "{n_samples}"
      task_description: "{task_description}"
  - id: 6
    skill: groot_data
    method: validate_dataset_quality
  - id: 7
    skill: groot_data
    method: format_for_groot
  - id: 8
    skill: groot_training
    method: prepare_lerobot_dataset
  - id: 9
    skill: groot_training
    method: configure_training
    params:
      task: "{task_description}"
  - id: 10
    skill: groot_training
    method: monitor_metrics
output:
  - data/datasets/groot_ready/
  - data/training_config.yml
