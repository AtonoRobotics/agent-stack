---
name: physics_identification
description: System identification for robot physics parameters
robot: configurable
inputs:
  urdf_path: required
  test_trajectories: auto-generate
steps:
  - id: 1
    skill: isaac_setup
    method: load_urdf
    params:
      urdf_path: "{urdf_path}"
  - id: 2
    skill: isaac_setup
    method: configure_physics
  - id: 3
    skill: physics_research
    method: identify_motor_parameters
    params:
      joint: all
      trajectory: "{test_trajectories}"
  - id: 4
    skill: physics_research
    method: identify_mass_properties
    params:
      link: all
  - id: 5
    skill: physics_research
    method: friction_identification
    params:
      joint: all
  - id: 6
    skill: physics_research
    method: model_sensor_noise
    params:
      sensor: all
  - id: 7
    skill: physics_research
    method: sim_to_real_gap_analysis
    params:
      sim_data: auto
      real_data: required
  - id: 8
    skill: analysis
    method: generate_analysis_report
output:
  - results/physics_identification_report.md
