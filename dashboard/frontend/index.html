// Main Cockpit Page
function CockpitPage() {
  var nav = React.useContext(NavContext);
  var robotId = (nav.params && nav.params.id) || 'dobot_cr10';

  // State
  var statusState = useState({ online: false, joints: [], mode: 'unknown', pose: null, tcp_connection: {}, data_source: 'ros2' });
  var status = statusState[0];
  var setStatus = statusState[1];

  var urdfState = useState(null);
  var urdfData = urdfState[0];
  var setUrdfData = urdfState[1];

  var topicsState = useState([]);
  var topics = topicsState[0];
  var setTopics = topicsState[1];

  var controllersState = useState([]);
  var controllers = controllersState[0];
  var setControllers = controllersState[1];

  var diagnosticsState = useState([]);
  var diagnostics = diagnosticsState[0];
  var setDiagnostics = diagnosticsState[1];

  var nodePanelState = useState(false);
  var showNodePanel = nodePanelState[0];
  var setShowNodePanel = nodePanelState[1];

  var payloadState = useState(null);
  var cameraPayload = payloadState[0];
  var setCameraPayload = payloadState[1];

  // Fetch URDF once
  useEffect(function() {
    authFetch('/api/robot/' + robotId + '/urdf')
      .then(function(r) { return r.json(); })
      .then(setUrdfData)
      .catch(function() {});
  }, []);

  // WebSocket for robot status at ~10hz (replaces REST polling)
  useEffect(function() {
    var wsToken = localStorage.getItem('mc_token') || '';
    var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var ws = null;
    var reconnectTimer = null;

    function connect() {
      ws = new WebSocket(protocol + '//' + location.host + '/ws/robot/' + robotId + '?token=' + encodeURIComponent(wsToken));
      ws.onmessage = function(evt) {
        try {
          var msg = JSON.parse(evt.data);
          if (msg.type === 'robot_status' && msg.data) {
            setStatus(msg.data);
          }
        } catch(e) {}
      };
      ws.onclose = function() {
        reconnectTimer = setTimeout(connect, 3000);
      };
      ws.onerror = function() {};
    }
    connect();

    return function() {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      if (ws) { try { ws.close(); } catch(e) {} }
    };
  }, [robotId]);

  // Poll low-frequency data (topics, controllers, diagnostics) at 5s
  useEffect(function() {
    function fetchSlow() {
      authFetch('/api/robot/' + robotId + '/topics')
        .then(function(r) { return r.json(); })
        .then(function(d) { setTopics(d.topics || []); })
        .catch(function() {});
      authFetch('/api/robot/' + robotId + '/controllers')
        .then(function(r) { return r.json(); })
        .then(function(d) { setControllers(d.controllers || []); })
        .catch(function() {});
      authFetch('/api/robot/' + robotId + '/diagnostics')
        .then(function(r) { return r.json(); })
        .then(function(d) { setDiagnostics(d.diagnostics || []); })
        .catch(function() {});
    }
    fetchSlow();
    var interval = setInterval(fetchSlow, 5000);
    return function() { clearInterval(interval); };
  }, [robotId]);

  var urdfChain = urdfData ? (urdfData.kinematic_chain || []) : [];
  var online = status.online;

  function handleSourceChange(newSource) {
    setStatus(Object.assign({}, status, { data_source: newSource }));
  }

  return e('div', { className: 'cockpit' },
    e(CockpitHeader, {
      online: online, robotId: robotId, dof: urdfData ? urdfData.dof : 6,
      tcpConnection: status.tcp_connection, dataSource: status.data_source,
      onSourceChange: handleSourceChange
    }),

    // Row 1: 3D viewer + Joint gauges
    e('div', { className: 'cockpit-grid', style: { gridTemplateColumns: '1.5fr 1fr' } },
      e(ThreeJSViewer, { online: online, joints: status.joints, urdfChain: urdfChain, cameraPayload: cameraPayload }),
      e(JointStatesCard, { joints: status.joints, urdfChain: urdfChain })
    ),

    // Row 1.5: Payload configuration
    e('div', { className: 'cockpit-grid', style: { gridTemplateColumns: '1fr' } },
      e(PayloadConfigPanel, { onPayloadChange: setCameraPayload })
    ),

    // Simulation mode panel
    e('div', { className: 'cockpit-grid', style: { gridTemplateColumns: '1fr' } },
      e(SimulationModePanel, null)
    ),

    // Row 2: Mode + End Effector + Velocity
    e('div', { className: 'cockpit-grid cockpit-grid--3' },
      e(RobotModeCard, { mode: status.mode, online: online }),
      e(EndEffectorCard, { pose: status.pose }),
      e(VelocityChart, { joints: status.joints })
    ),

    // Row 3: Topics + Controllers + Diagnostics
    e('div', { className: 'cockpit-grid cockpit-grid--3' },
      e(CockpitTopicsCard, { topics: topics }),
      e(CockpitControllersCard, { controllers: controllers }),
      e(CockpitDiagnosticsCard, { diagnostics: diagnostics })
    ),

    // Node graph button
    e('div', { style: { marginTop: '16px', textAlign: 'center' } },
      e('button', {
        style: {
          padding: '10px 24px', fontSize: '12px', fontWeight: 700,
          background: 'var(--raised)', border: '1px solid var(--border)',
          borderRadius: 'var(--radius-sm)', color: 'var(--text-secondary)',
          textTransform: 'uppercase', letterSpacing: '0.5px', cursor: 'pointer',
          transition: 'all 150ms ease'
        },
        onClick: function() { setShowNodePanel(true); }
      }, '\u25C9 OPEN NODE GRAPH')
    ),

    // Slide-in node graph panel
    e(CockpitNodeGraphPanel, {
      open: showNodePanel,
      onClose: function() { setShowNodePanel(false); },
      urdfChain: urdfChain
    })
  );
}

function LoginPage(props) {
  var usernameState = useState('');
  var username = usernameState[0];
  var setUsername = usernameState[1];
  var passwordState = useState('');
  var password = passwordState[0];
  var setPassword = passwordState[1];
  var errorState = useState('');
  var error = errorState[0];
  var setError = errorState[1];
  var loadingState = useState(false);
  var loading = loadingState[0];
  var setLoading = loadingState[1];

  function handleSubmit(ev) {
    ev.preventDefault();
    if (!username || !password) return;
    setLoading(true);
    setError('');
    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    })
    .then(function(r) {
      if (!r.ok) return r.json().then(function(d) { throw new Error(d.detail || 'Login failed'); });
      return r.json();
    })
    .then(function(data) {
      localStorage.setItem('mc_token', data.token);
      localStorage.setItem('mc_user', JSON.stringify({ username: data.username, role: data.role }));
      props.onLogin({ username: data.username, role: data.role }, data.token);
    })
    .catch(function(err) {
      setError(err.message || 'Login failed');
      setLoading(false);
    });
  }

  return e('div', { className: 'login-page' },
    e('form', { className: 'login-card', onSubmit: handleSubmit },
      e('div', { className: 'login-card__logo' },
        e('div', { className: 'login-card__logo-symbol' }, '\u03B1'),
        e('div', { className: 'login-card__logo-name' }, 'MISSION CONTROL'),
        e('div', { className: 'login-card__logo-company' }, 'by Alpha'),
        e('div', { className: 'login-card__divider' })
      ),
      error ? e('div', { className: 'login-error' }, error) : null,
      e('div', { className: 'login-field' },

function DemosPage() {
  var demosState = useState(null);
  var demos = demosState[0]; var setDemos = demosState[1];
  var prereqState = useState({});
  var prereqs = prereqState[0]; var setPrereqs = prereqState[1];
  var runningState = useState(null);
  var runningDemo = runningState[0]; var setRunningDemo = runningState[1];
  var detailState = useState(null);
  var selectedDetail = detailState[0]; var setSelectedDetail = detailState[1];
  var logState = useState([]);
  var logLines = logState[0]; var setLogLines = logState[1];
  var errorState = useState(null);
  var error = errorState[0]; var setError = errorState[1];
  var confirmState = useState(null);
  var confirmDemoId = confirmState[0]; var setConfirmDemoId = confirmState[1];

  function fetchDemos() {
    authFetch('/api/demos').then(function(r) { return r.json(); }).then(function(data) {
      setDemos(data.demos);
      setPrereqs(data.prerequisites);
      var running = data.demos.find(function(d) { return d.status === 'running'; });
      setRunningDemo(running ? running.id : null);
      // Auto-update selected detail panel with fresh data
      setSelectedDetail(function(prev) {
        if (!prev) return null;
        var updated = data.demos.find(function(d) { return d.id === prev.id; });
        return updated || prev;
      });
    }).catch(function(e) { setError('Failed to load demos: ' + e.message); });
  }

  useEffect(function() {
    fetchDemos();
    var interval = setInterval(fetchDemos, 5000);
    return function() { clearInterval(interval); };
  }, []);

  // WebSocket for live log when demo is running
  useEffect(function() {
    if (!runningDemo) return;
    var token = localStorage.getItem('mc_token');
    if (!token) return;
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var wsUrl = proto + '//' + location.host + '/ws/demo/' + runningDemo + '?token=' + token;
    var ws = new WebSocket(wsUrl);
    ws.onmessage = function(ev) {
      try {
        var msg = JSON.parse(ev.data);
        if (msg.type === 'demo_log') {
          setLogLines(function(prev) { return prev.concat([msg.line]).slice(-500); });
        } else if (msg.type === 'demo_status') {
          fetchDemos();
          if (msg.status !== 'running') { setRunningDemo(null); }
        }
      } catch(e) {}
    };
    return function() { ws.close(); };
  }, [runningDemo]);

  function handleRunRequest(demoId) {
    setConfirmDemoId(demoId);
  }

  function handleRunConfirmed(demoId) {
    setConfirmDemoId(null);
    setLogLines([]);
    authFetch('/api/demos/' + demoId + '/run', { method: 'POST' }).then(function(r) {
      if (r.status === 202) {
        setRunningDemo(demoId);
        fetchDemos();
      } else {
        return r.json().then(function(d) { setError(d.detail || 'Failed to start'); });
      }
    }).catch(function(e) { setError(e.message); });
  }

  function handleStop(demoId) {
    authFetch('/api/demos/' + demoId + '/stop', { method: 'DELETE' }).then(function() {
      setRunningDemo(null);
      fetchDemos();
    }).catch(function(e) { setError(e.message); });
  }

  function handleView(demoId) {
    var demo = demos.find(function(d) { return d.id === demoId; });
    setSelectedDetail(demo);
  }

  var canRun = prereqs.docker_available && prereqs.gpu_available;
  var confirmDemoName = confirmDemoId && demos ? (demos.find(function(d) { return d.id === confirmDemoId; }) || {}).name : '';

  return e('div', null,
    // Confirm dialog
    e(DemoConfirmDialog, {
      demoId: confirmDemoId, demoName: confirmDemoName,
      onConfirm: handleRunConfirmed, onCancel: function() { setConfirmDemoId(null); }
    }),

    e('div', { className: 'page-header' },
      e('div', null,
        e('h1', { className: 'page-header__title' }, 'DEMOS'),
        e('p', { className: 'page-header__subtitle' }, 'Isaac Sim demonstrations — cuRobo vs standard kinematics')
      )
    ),

    e(DemoPrereqBar, { prerequisites: prereqs, runningDemo: runningDemo }),

    error ? e('div', { style: { padding: '12px 16px', background: 'rgba(244,67,54,0.1)', border: '1px solid var(--danger)', borderRadius: 'var(--radius)', marginBottom: '16px', fontSize: '12px', color: 'var(--danger)' } },
      error,
      e('button', { style: { marginLeft: '12px', background: 'none', border: 'none', color: 'var(--danger)', cursor: 'pointer', textDecoration: 'underline' }, onClick: function() { setError(null); } }, 'dismiss')
    ) : null,

    // Detail view or card grid
    selectedDetail
      ? e(DemoDetailPanel, {
          demo: selectedDetail,
          isRunning: runningDemo === selectedDetail.id,
          runningDemo: runningDemo,
          canRun: canRun,
          logLines: runningDemo === selectedDetail.id ? logLines : null,
          onRun: handleRunRequest,
          onStop: handleStop,
          onClose: function() { setSelectedDetail(null); }
        })
      : demos ? e('div', { className: 'demo-grid' },
          demos.map(function(demo) {
            return e(DemoCard, {
              key: demo.id, demo: demo, canRun: canRun, runningDemo: runningDemo,
              onRun: handleRunRequest, onStop: handleStop, onView: handleView,
            });
          })
        ) : e('div', { style: { textAlign: 'center', padding: '60px', color: 'var(--text-secondary)' } }, 'Loading demos...'),

    // Live log viewer when running (only show if detail panel is NOT open for the running demo)
    runningDemo && !(selectedDetail && selectedDetail.id === runningDemo) ? e('div', { style: { marginTop: '20px' } },
      e('h3', { style: { fontSize: '14px', fontWeight: 700, marginBottom: '8px', textTransform: 'uppercase' } },
        Icon('activity'), ' Live Output — ' + runningDemo
      ),
      e(DemoLogViewer, { lines: logLines })
    ) : null
  );
}

// =========================================================================
// APP ROOT
// =========================================================================
function App() {
  // Auth state
  var tokenState = useState(localStorage.getItem('mc_token'));
  var token = tokenState[0];
  var setToken = tokenState[1];
  var userState = useState(function() {
    try { return JSON.parse(localStorage.getItem('mc_user')); } catch(ex) { return null; }
  });
  var user = userState[0];
  var setUser = userState[1];

  function handleLogin(userData, tokenStr) {
    setUser(userData);
    setToken(tokenStr);
  }

  function handleLogout() {
    authFetch('/api/auth/logout', { method: 'POST' }).catch(function() {});
    localStorage.removeItem('mc_token');
    localStorage.removeItem('mc_user');
    setToken(null);
    setUser(null);
  }

  var authContextValue = useMemo(function() {
    return { user: user, token: token, logout: handleLogout };
  }, [user, token]);

  // If no token, show login
  if (!token) {
    return e(LoginPage, { onLogin: handleLogin });
  }

  // Authenticated app below
  var wsStatus = useWebSocket();
  var pageState = useState('lab');
  var currentPage = pageState[0];
  var setCurrentPage = pageState[1];
  var paramsState = useState({});
  var navParams = paramsState[0];
  var setNavParams = paramsState[1];

  // Splash screen state
  var splashState = useState(true);
  var showSplash = splashState[0];
  var setShowSplash = splashState[1];

  useEffect(function() {
    var timer = setTimeout(function() { setShowSplash(false); }, 2000);
    return function() { clearTimeout(timer); };
  }, []);

  var navigate = useCallback(function(page, params) {
    setCurrentPage(page);
    setNavParams(params || {});
  }, []);

  var navContextValue = useMemo(function() {
    return { page: currentPage, params: navParams, navigate: navigate };
  }, [currentPage, navParams, navigate]);

  // Splash screen
  if (showSplash) {
    return e('div', {
      style: {
        position: 'fixed', inset: 0, background: '#0F0F0F', zIndex: 9999,
        display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
        animation: 'fadeIn 0.3s ease'
      }
    },
      e('div', {
        style: {
          fontSize: '60px', color: '#E8A020', fontStyle: 'italic',
          fontFamily: "'Times New Roman', serif", lineHeight: 1, marginBottom: '16px'
        }
      }, '\u03B1'),
      e('div', {
        style: {
          fontSize: '14px', fontWeight: 600, letterSpacing: '0.2em',
          color: '#E0E0E0', textTransform: 'uppercase', fontFamily: 'Inter, sans-serif'
        }
      }, 'MISSION CONTROL'),
      e('div', {
        style: {
          fontSize: '11px', color: '#808080', letterSpacing: '0.1em',
          textTransform: 'uppercase', marginTop: '6px'
        }
      }, 'by Alpha')
    );
  }

  var pageElement = null;
  if (currentPage === 'lab') pageElement = e(LabOverviewPage);
  else if (currentPage === 'fleet') pageElement = e(FleetPage);
  else if (currentPage === 'robot') pageElement = e(RobotDetailPage);
  else if (currentPage === 'cockpit') pageElement = e(CockpitPage);
  else if (currentPage === 'simulations') pageElement = e(SimulationsPage);
  else if (currentPage === 'training') pageElement = e(TrainingPage);
  else if (currentPage === 'agents') pageElement = e(AgentsPage);
  else if (currentPage === 'demos') pageElement = e(DemosPage);

  return e(AuthContext.Provider, { value: authContextValue },
    e(NavContext.Provider, { value: navContextValue },
      e('div', { className: 'layout' },
        e(Sidebar, { wsStatus: wsStatus }),
        e('main', { className: 'main-content' }, pageElement),
        e(MobileNav)
      )
    )
  );
}

// =========================================================================
// MOUNT
// =========================================================================
var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(e(App));
</script>
</body>
</html>
