<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>\u03B1 Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.0/umd/Recharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ========== CSS VARIABLES ========== */
:root {
  --bg: #0F0F0F;
  --surface: #1A1A1A;
  --raised: #242424;
  --border: #2E2E2E;
  --border-active: #E8A020;
  --accent: #E8A020;
  --accent-dim: rgba(232,160,32,0.15);
  --success: #4CAF50;
  --warning: #FF9800;
  --danger: #F44336;
  --info: #2196F3;
  --text: #E0E0E0;
  --text-secondary: #808080;
  --text-dim: #555555;
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --sidebar-w: 240px;
  --mobile-nav-h: 64px;
  --radius: 8px;
  --radius-sm: 4px;
  --transition: 150ms ease;
}

/* ========== RESET ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { font-family: var(--font-ui); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button { font-family: var(--font-ui); cursor: pointer; border: none; background: none; color: var(--text); }
input, select { font-family: var(--font-ui); background: var(--raised); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; outline: none; }
input:focus, select:focus { border-color: var(--accent); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
#root { min-height: 100vh; }

/* ========== ANIMATIONS ========== */
@keyframes pulse-green {
  0%, 100% { box-shadow: 0 0 0 0 rgba(76,175,80,0.7); }
  50% { box-shadow: 0 0 6px 3px rgba(76,175,80,0.3); }
}
@keyframes pulse-amber {
  0%, 100% { box-shadow: 0 0 0 0 rgba(232,160,32,0.7); }
  50% { box-shadow: 0 0 6px 3px rgba(232,160,32,0.3); }
}
@keyframes pulse-red {
  0%, 100% { box-shadow: 0 0 0 0 rgba(244,67,54,0.7); }
  50% { box-shadow: 0 0 6px 3px rgba(244,67,54,0.3); }
}
@keyframes pulse-blue {
  0%, 100% { box-shadow: 0 0 0 0 rgba(33,150,243,0.7); }
  50% { box-shadow: 0 0 6px 3px rgba(33,150,243,0.3); }
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideInLeft {
  from { opacity: 0; transform: translateX(-12px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes barGrow {
  from { width: 0; }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ========== STATUS DOT ========== */
.status-dot {
  display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.status-dot--online { background: var(--success); animation: pulse-green 2s infinite; }
.status-dot--warning { background: var(--warning); animation: pulse-amber 2s infinite; }
.status-dot--offline { background: var(--danger); animation: pulse-red 2s infinite; }
.status-dot--busy { background: var(--info); animation: pulse-blue 2s infinite; }
.status-dot--lg { width: 14px; height: 14px; }

/* ========== LAYOUT ========== */
.layout { display: flex; min-height: 100vh; }
.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; z-index: 100;
  transition: transform 0.2s ease;
}
.main-content {
  margin-left: var(--sidebar-w); flex: 1; min-height: 100vh;
  padding: 24px 28px 28px 28px;
}

/* Sidebar internals */
.sidebar__logo {
  padding: 20px 20px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.sidebar__logo-symbol {
  font-size: 28px; color: var(--accent); font-style: italic;
  font-family: 'Times New Roman', serif; line-height: 1;
}
.sidebar__logo-text-wrap { display: flex; flex-direction: column; }
.sidebar__logo-name {
  font-family: var(--font-ui); font-weight: 600; font-size: 13px;
  letter-spacing: 0.15em; color: var(--text); text-transform: uppercase;
}
.sidebar__logo-company {
  font-size: 10px; color: var(--text-secondary); letter-spacing: 0.1em;
  text-transform: uppercase; margin-top: 2px;
}
.sidebar__nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
.sidebar__link {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
  color: var(--text-secondary); transition: all var(--transition);
}
.sidebar__link:hover { color: var(--text); background: var(--raised); }
.sidebar__link--active {
  color: var(--accent); background: var(--accent-dim);
  border-left: 3px solid var(--accent);
}
.sidebar__link svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar__footer {
  padding: 14px 16px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-dim);
}
.sidebar__footer .ws-status { display: flex; align-items: center; gap: 6px; margin-top: 6px; }

/* ========== MOBILE NAV ========== */
.mobile-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--mobile-nav-h); background: var(--surface);
  border-top: 1px solid var(--border); z-index: 100;
  justify-content: space-around; align-items: center;
}
.mobile-nav__link {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 500; color: var(--text-secondary);
  padding: 6px 12px; border-radius: 6px; transition: color var(--transition);
}
.mobile-nav__link--active { color: var(--accent); }
.mobile-nav__link svg { width: 20px; height: 20px; }

/* ========== CARDS ========== */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
  animation: fadeIn 0.3s ease;
}
.card--raised { background: var(--raised); }
.card--accent-left { border-left: 3px solid var(--accent); }
.card__header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.card__title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); }

/* Stat card */
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
  border-left: 3px solid var(--accent);
  animation: fadeIn 0.3s ease;
}
.stat-card__label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin-bottom: 8px; }
.stat-card__value { font-family: var(--font-mono); font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; }
.stat-card__sub { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); margin-top: 6px; }

/* ========== GAUGE BAR ========== */
.gauge { margin: 6px 0; }
.gauge__header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.gauge__label { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
.gauge__value { font-family: var(--font-mono); font-size: 11px; color: var(--text); font-weight: 600; }
.gauge__track {
  width: 100%; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden;
}
.gauge__fill {
  height: 100%; border-radius: 3px; transition: width 0.6s ease;
  animation: barGrow 0.8s ease;
}
.gauge__fill--green { background: var(--success); }
.gauge__fill--amber { background: var(--accent); }
.gauge__fill--red { background: var(--danger); }
.gauge__fill--blue { background: var(--info); }

/* ========== BADGE ========== */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap;
}
.badge--success { background: rgba(76,175,80,0.15); color: var(--success); }
.badge--warning { background: rgba(255,152,0,0.15); color: var(--warning); }
.badge--danger { background: rgba(244,67,54,0.15); color: var(--danger); }
.badge--info { background: rgba(33,150,243,0.15); color: var(--info); }
.badge--accent { background: var(--accent-dim); color: var(--accent); }
.badge--neutral { background: rgba(128,128,128,0.15); color: var(--text-secondary); }

/* ========== TABLE ========== */
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th {
  text-align: left; padding: 10px 12px; font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.7px; color: var(--text-secondary);
  border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
  white-space: nowrap;
}
.data-table th:hover { color: var(--accent); }
.data-table th .sort-arrow { margin-left: 4px; font-size: 9px; }
.data-table td {
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.data-table tr:nth-child(even) td { background: rgba(255,255,255,0.015); }
.data-table tr:hover td { background: rgba(232,160,32,0.04); }
.data-table .mono { font-family: var(--font-mono); font-size: 11px; }

/* ========== TAB NAV ========== */
.tab-nav { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab-nav__item {
  padding: 10px 18px; font-size: 12px; font-weight: 600;
  color: var(--text-secondary); border-bottom: 2px solid transparent;
  transition: all var(--transition); cursor: pointer;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.tab-nav__item:hover { color: var(--text); }
.tab-nav__item--active { color: var(--accent); border-bottom-color: var(--accent); }

/* ========== ALERT BANNER ========== */
.alert-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; border-radius: var(--radius);
  margin-bottom: 20px; font-size: 12px; font-weight: 500;
  animation: fadeIn 0.3s ease;
}
.alert-banner--danger { background: rgba(244,67,54,0.12); border: 1px solid rgba(244,67,54,0.3); color: #F77; }
.alert-banner--warning { background: rgba(255,152,0,0.12); border: 1px solid rgba(255,152,0,0.3); color: #FFA726; }
.alert-banner svg { width: 16px; height: 16px; flex-shrink: 0; }

/* ========== ACTIVITY FEED ========== */
.activity-feed { max-height: 320px; overflow-y: auto; }
.activity-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid var(--border);
  animation: slideInLeft 0.3s ease;
}
.activity-item__dot { margin-top: 5px; }
.activity-item__time { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); white-space: nowrap; min-width: 50px; margin-top: 1px; }
.activity-item__msg { font-size: 12px; color: var(--text-secondary); flex: 1; }

/* ========== PAGE HEADER ========== */
.page-header { margin-bottom: 24px; }
.page-header__title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.page-header__sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* ========== GRID HELPERS ========== */
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
.gap-16 { gap: 16px; }
.gap-20 { gap: 20px; }
.mb-16 { margin-bottom: 16px; }
.mb-20 { margin-bottom: 20px; }
.mb-24 { margin-bottom: 24px; }
.flex { display: flex; }
.flex-col { flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-8 { gap: 8px; }
.gap-10 { gap: 10px; }
.gap-12 { gap: 12px; }

/* ========== PROGRESS BAR ========== */
.progress-bar { display: flex; align-items: center; gap: 10px; }
.progress-bar__track { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.progress-bar__fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width 0.5s ease; }
.progress-bar__label { font-family: var(--font-mono); font-size: 11px; color: var(--text); min-width: 36px; text-align: right; }

/* ========== FILTER ROW ========== */
.filter-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
.filter-row select, .filter-row input { font-size: 12px; padding: 6px 10px; min-width: 120px; }

/* ========== HERO SECTION ========== */
.hero {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px 28px;
  margin-bottom: 20px; animation: fadeIn 0.3s ease;
}
.hero__name { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
.hero__meta { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
.hero__meta-item { display: flex; align-items: center; gap: 6px; }
.hero__meta-item .label { color: var(--text-dim); }
.hero__meta-item .value { font-family: var(--font-mono); color: var(--text); }

/* ========== TIMELINE ========== */
.timeline-item {
  display: flex; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border);
  position: relative;
}
.timeline-item__marker {
  width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex-shrink: 0;
  border: 2px solid var(--accent); background: var(--bg);
}
.timeline-item__marker--filled { background: var(--accent); }
.timeline-item__content { flex: 1; }
.timeline-item__title { font-size: 13px; font-weight: 600; }
.timeline-item__detail { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }
.timeline-item__time { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); }

/* ========== DONUT PLACEHOLDER ========== */
.donut-chart-container { display: flex; justify-content: center; padding: 10px 0; }

/* ========== RESPONSIVE ========== */
@media (max-width: 1024px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-6 { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .main-content { margin-left: 0; padding: 16px 14px 80px 14px; }
  .mobile-nav { display: flex; }
  .grid-2, .grid-3, .grid-4, .grid-6 { grid-template-columns: 1fr; }
  .hero__meta { flex-direction: column; gap: 8px; }
  .filter-row { flex-direction: column; }
  .tab-nav { overflow-x: auto; }
}

/* ========== ROS2 GRAPH ========== */
.ros2-controls {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 12px 16px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 12px;
}
.ros2-controls button {
  padding: 6px 12px; font-size: 11px; font-weight: 600;
  background: var(--raised); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text-secondary);
  transition: all var(--transition); text-transform: uppercase; letter-spacing: 0.3px;
}
.ros2-controls button:hover { border-color: var(--accent); color: var(--text); }
.ros2-controls button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.ros2-controls__sep { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
.ros2-controls__count { font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); margin-left: auto; }
.ros2-controls input { font-size: 11px; padding: 5px 8px; width: 140px; }

.ros2-graph-wrap { position: relative; margin-bottom: 16px; }
.ros2-graph-container {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; height: 500px;
  /* dot grid background */
  background-image: radial-gradient(circle, #1A1A1A 1px, transparent 1px);
  background-size: 20px 20px;
}
.ros2-graph-container svg { width: 100%; height: 100%; display: block; }

.ros2-minimap {
  position: absolute; bottom: 10px; right: 10px; width: 100px; height: 75px;
  background: var(--bg); border: 1px solid var(--accent); border-radius: var(--radius-sm);
  overflow: hidden; opacity: 0.85; pointer-events: none;
}
.ros2-minimap svg { width: 100%; height: 100%; display: block; }

.ros2-detail-panel {
  position: absolute; top: 10px; right: 10px; width: 260px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; font-size: 12px;
  max-height: calc(100% - 20px); overflow-y: auto; z-index: 10;
  animation: fadeIn 0.2s ease;
}
.ros2-detail-panel__title {
  font-weight: 700; font-family: var(--font-mono); font-size: 13px;
  color: var(--accent); margin-bottom: 10px; word-break: break-all;
  padding-right: 20px;
}
.ros2-detail-panel__section { margin-bottom: 10px; }
.ros2-detail-panel__label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-secondary); margin-bottom: 4px; font-weight: 600;
}
.ros2-detail-panel__item {
  font-family: var(--font-mono); font-size: 11px; color: var(--text);
  padding: 2px 0;
}
.ros2-detail-panel__close {
  position: absolute; top: 10px; right: 12px; font-size: 18px;
  color: var(--text-secondary); cursor: pointer; line-height: 1;
}
.ros2-detail-panel__close:hover { color: var(--text); }

.ros2-offline {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 400px; color: var(--text-secondary); gap: 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
}
.ros2-offline__box {
  border: 1px solid var(--border); border-radius: var(--radius); padding: 32px 48px;
  text-align: center; background: var(--bg);
}
.ros2-offline__dot { width: 12px; height: 12px; border-radius: 50%; background: var(--text-dim); display: inline-block; margin-bottom: 12px; }
.ros2-offline__title { font-size: 14px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 12px; color: var(--text); }
.ros2-offline__sub { font-size: 12px; color: var(--text-dim); margin-bottom: 16px; }
.ros2-offline__link {
  display: inline-block; padding: 6px 14px; font-size: 11px; font-weight: 600;
  background: var(--raised); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.3px;
}

.ros2-graph-tooltip {
  position: absolute; pointer-events: none; z-index: 20;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 8px 12px; font-size: 11px; max-width: 250px;
  animation: fadeIn 0.15s ease;
}
.ros2-graph-tooltip__name { font-family: var(--font-mono); font-weight: 700; color: var(--accent); margin-bottom: 4px; }
.ros2-graph-tooltip__row { color: var(--text-secondary); font-size: 10px; }

@media (max-width: 768px) {
  .ros2-graph-container { height: 350px; }
  .ros2-detail-panel { width: 200px; font-size: 11px; padding: 12px; }
  .ros2-minimap { width: 80px; height: 60px; }
}

/* ========== LOGIN PAGE ========== */
.login-page {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 10000;
}
.login-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 40px 36px 32px;
  width: 360px; max-width: 90vw;
  animation: fadeIn 0.4s ease;
}
.login-card__logo { text-align: center; margin-bottom: 28px; }
.login-card__logo-symbol {
  font-size: 48px; color: var(--accent); font-style: italic;
  font-family: 'Times New Roman', serif; line-height: 1;
}
.login-card__logo-name {
  font-size: 13px; font-weight: 600; letter-spacing: 0.15em;
  color: var(--text); text-transform: uppercase; margin-top: 8px;
}
.login-card__logo-company {
  font-size: 10px; color: var(--text-secondary);
  letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3px;
}
.login-card__divider {
  width: 40px; height: 2px; background: var(--accent);
  margin: 16px auto 24px; border-radius: 1px;
}
.login-field { margin-bottom: 16px; }
.login-field label {
  display: block; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-secondary); margin-bottom: 6px;
}
.login-field input {
  width: 100%; padding: 10px 12px; font-size: 13px;
  border-radius: var(--radius-sm);
}
.login-btn {
  width: 100%; padding: 10px; margin-top: 8px;

// DataTable with sort
function DataTable(props) {
  var columns = props.columns;
  var data = props.data;
  var sortState = useState({ col: null, asc: true });
  var sortCol = sortState[0].col;
  var sortAsc = sortState[0].asc;
  var setSort = sortState[1];

  var sorted = useMemo(function() {
    if (!sortCol) return data;
    var copy = data.slice();
    copy.sort(function(a, b) {
      var va = a[sortCol], vb = b[sortCol];
      if (typeof va === 'number' && typeof vb === 'number') return sortAsc ? va - vb : vb - va;
      va = String(va); vb = String(vb);
      return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    });
    return copy;
  }, [data, sortCol, sortAsc]);

  function onSort(col) {
    setSort(function(prev) {
      if (prev.col === col) return { col: col, asc: !prev.asc };
      return { col: col, asc: true };
    });
  }

  return e('div', { style: { overflowX: 'auto' } },
    e('table', { className: 'data-table' },
      e('thead', null,
        e('tr', null,
          columns.map(function(c) {
            var arrow = sortCol === c.key ? (sortAsc ? ' \u25B2' : ' \u25BC') : '';
            return e('th', { key: c.key, onClick: function() { onSort(c.key); } },
              c.label, arrow ? e('span', { className: 'sort-arrow' }, arrow) : null
            );
          })
        )
      ),
      e('tbody', null,
        sorted.map(function(row, ri) {
          return e('tr', { key: ri },
            columns.map(function(c) {
              if (c.render) return e('td', { key: c.key }, c.render(row));
              var cls = c.mono ? 'mono' : '';
              return e('td', { key: c.key, className: cls }, row[c.key]);
            })
          );
        })
      )
    )
  );
}

// =========================================================================
// WEBSOCKET HOOK
// =========================================================================
function useWebSocket() {
  var wsState = useState('disconnected');
  var wsStatus = wsState[0];
  var setWsStatus = wsState[1];
  var wsRef = useRef(null);
  var reconnectRef = useRef(null);

  useEffect(function() {
    function connect() {
      try {
        var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        var wsToken = localStorage.getItem('mc_token') || '';
        var ws = new WebSocket(protocol + '//' + location.host + '/ws/live?token=' + encodeURIComponent(wsToken));
        wsRef.current = ws;
        ws.onopen = function() { setWsStatus('connected'); };
        ws.onclose = function() {
          setWsStatus('disconnected');
          reconnectRef.current = setTimeout(connect, 3000);
        };
        ws.onerror = function() { setWsStatus('error'); };
        ws.onmessage = function(evt) {
          try { /* handle incoming messages */ } catch(e) {}
        };
      } catch(err) {
        setWsStatus('error');
        reconnectRef.current = setTimeout(connect, 5000);
      }
    }
    connect();
    return function() {
      if (wsRef.current) wsRef.current.close();
      if (reconnectRef.current) clearTimeout(reconnectRef.current);
    };
  }, []);

  return wsStatus;
}

// ── Robot Telemetry Tab ──────────────────────────────────
function RobotTelemetryTab(props) {
  var robotId = props.robotId || (props.robot && props.robot.id) || 'dobot_cr10';
  var COLORS = ['#E8A020', '#4CAF50', '#2196F3', '#FF9800', '#9C27B0', '#F44336'];
  var MAX_SAMPLES = 300;

  // Ring buffer for 30s of data at 10Hz
  var posBufferRef = useRef([]);
  var velBufferRef = useRef([]);

  var posState = useState([]);
  var posData = posState[0];
  var setPosData = posState[1];

  var velState = useState([]);
  var velData = velState[0];
  var setVelData = velState[1];

  var currentState = useState([]);
  var currentValues = currentState[0];
  var setCurrentValues = currentState[1];

  // WebSocket for 10Hz joint data
  useEffect(function() {
    var wsToken = localStorage.getItem('mc_token') || '';
    var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var ws = null;
    var reconnectTimer = null;
    var frameCount = 0;

    function connect() {
      ws = new WebSocket(protocol + '//' + location.host + '/ws/robot/' + robotId + '?token=' + encodeURIComponent(wsToken));
      ws.onmessage = function(evt) {
        try {
          var msg = JSON.parse(evt.data);
          if (msg.type !== 'robot_status' || !msg.data || !msg.data.joints) return;
          var joints = msg.data.joints;
          frameCount++;

          // Build position point
          var posPoint = { t: frameCount };
          var velPoint = { t: frameCount };
          var vals = [];
          for (var i = 0; i < Math.min(joints.length, 6); i++) {
            posPoint['j' + (i + 1)] = (joints[i].position_deg || 0);
            velPoint['j' + (i + 1)] = Math.abs(joints[i].velocity || 0);
            vals.push({
              name: joints[i].name || ('J' + (i + 1)),
              position: (joints[i].position_deg || 0).toFixed(2),
              velocity: (joints[i].velocity || 0).toFixed(4),
              effort: (joints[i].effort || 0).toFixed(2)
            });
          }

          posBufferRef.current.push(posPoint);
          if (posBufferRef.current.length > MAX_SAMPLES) posBufferRef.current.shift();
          velBufferRef.current.push(velPoint);
          if (velBufferRef.current.length > MAX_SAMPLES) velBufferRef.current.shift();

          // Update state every 3 frames (~3Hz render) to avoid excessive re-renders
          if (frameCount % 3 === 0) {
            setPosData(posBufferRef.current.slice());
            setVelData(velBufferRef.current.slice());
            setCurrentValues(vals);
          }
        } catch(ex) {}
      };
      ws.onclose = function() { reconnectTimer = setTimeout(connect, 3000); };
    }
    connect();
    return function() {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      if (ws) { try { ws.close(); } catch(ex) {} }
    };
  }, [robotId]);

  var chartMargin = { top: 10, right: 20, left: 10, bottom: 10 };
  var tooltipStyle = { background: '#242424', border: '1px solid #2E2E2E', borderRadius: '6px', fontSize: '11px', fontFamily: 'JetBrains Mono' };

  return e('div', null,
    // Joint Positions chart
    e('div', { className: 'card mb-20' },
      e('div', { className: 'card__header' },
        e('span', { className: 'card__title' }, 'Joint Positions (\u00B0)')
      ),
      e('div', { style: { height: '240px' } },
        posData.length > 1
          ? e(ResponsiveContainer, { width: '100%', height: 240 },
              e(LineChart, { data: posData, margin: chartMargin },
                e(CartesianGrid, { strokeDasharray: '3 3', stroke: '#2E2E2E' }),
                e(XAxis, { dataKey: 't', tick: false }),
                e(YAxis, { tick: { fill: '#808080', fontSize: 10, fontFamily: 'JetBrains Mono' }, domain: ['auto', 'auto'] }),
                e(Tooltip, { contentStyle: tooltipStyle }),
                e(Legend, { wrapperStyle: { fontSize: '11px' } }),
                [0,1,2,3,4,5].map(function(i) {
                  return e(Line, { key: 'pos'+i, type: 'monotone', dataKey: 'j' + (i+1), stroke: COLORS[i], strokeWidth: 1.5, dot: false, isAnimationActive: false, name: 'J' + (i+1) });
                })
              )
            )
          : e('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', color: 'var(--text-dim)', fontSize: '12px' } }, 'Awaiting telemetry data...')
      )
    ),

    // Joint Velocities chart
    e('div', { className: 'card mb-20' },
      e('div', { className: 'card__header' },
        e('span', { className: 'card__title' }, 'Joint Velocities (rad/s)')
      ),
      e('div', { style: { height: '240px' } },
        velData.length > 1
          ? e(ResponsiveContainer, { width: '100%', height: 240 },
              e(LineChart, { data: velData, margin: chartMargin },
                e(CartesianGrid, { strokeDasharray: '3 3', stroke: '#2E2E2E' }),
                e(XAxis, { dataKey: 't', tick: false }),
                e(YAxis, { tick: { fill: '#808080', fontSize: 10, fontFamily: 'JetBrains Mono' }, domain: [0, 'auto'] }),
                e(Tooltip, { contentStyle: tooltipStyle }),
                e(Legend, { wrapperStyle: { fontSize: '11px' } }),
                [0,1,2,3,4,5].map(function(i) {
                  return e(Line, { key: 'vel'+i, type: 'monotone', dataKey: 'j' + (i+1), stroke: COLORS[i], strokeWidth: 1.5, dot: false, isAnimationActive: false, name: 'J' + (i+1) });
                })
              )
            )
          : e('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', color: 'var(--text-dim)', fontSize: '12px' } }, 'Awaiting telemetry data...')
      )
    ),

    // Current values table
    e('div', { className: 'card' },
      e('div', { className: 'card__header' },
        e('span', { className: 'card__title' }, 'Current Joint Values')
      ),
      e('table', { style: { width: '100%', borderCollapse: 'collapse', fontFamily: 'var(--font-mono)', fontSize: '12px' } },
        e('thead', null,
          e('tr', { style: { borderBottom: '1px solid var(--border)' } },
            e('th', { style: { padding: '8px 12px', textAlign: 'left', color: 'var(--text-secondary)', fontWeight: 600, fontSize: '10px', textTransform: 'uppercase', letterSpacing: '0.5px' } }, 'Joint'),
            e('th', { style: { padding: '8px 12px', textAlign: 'right', color: 'var(--text-secondary)', fontWeight: 600, fontSize: '10px', textTransform: 'uppercase', letterSpacing: '0.5px' } }, 'Position (\u00B0)'),
            e('th', { style: { padding: '8px 12px', textAlign: 'right', color: 'var(--text-secondary)', fontWeight: 600, fontSize: '10px', textTransform: 'uppercase', letterSpacing: '0.5px' } }, 'Velocity (rad/s)'),
            e('th', { style: { padding: '8px 12px', textAlign: 'right', color: 'var(--text-secondary)', fontWeight: 600, fontSize: '10px', textTransform: 'uppercase', letterSpacing: '0.5px' } }, 'Effort')
          )
        ),
        e('tbody', null,
          currentValues.length > 0
            ? currentValues.map(function(v, idx) {
                return e('tr', { key: idx, style: { borderBottom: '1px solid var(--border)' } },
                  e('td', { style: { padding: '8px 12px', color: COLORS[idx] || 'var(--text)', fontWeight: 600 } }, v.name),
                  e('td', { style: { padding: '8px 12px', textAlign: 'right' } }, v.position),
                  e('td', { style: { padding: '8px 12px', textAlign: 'right' } }, v.velocity),
                  e('td', { style: { padding: '8px 12px', textAlign: 'right' } }, v.effort)
                );
              })
            : e('tr', null, e('td', { colSpan: 4, style: { padding: '20px', textAlign: 'center', color: 'var(--text-dim)' } }, 'No joint data'))
        )
      )
    )
  );
}

// TAB: ROS2 GRAPH
// =========================================================================
var KEY_TOPICS = ['/joint_states', '/tf', '/tf_static', '/robot_description', '/diagnostics'];
var NODE_ICONS = {
  'robot_state_publisher': '\uD83E\uDD16',
  'joint_state_publisher': '\u2699\uFE0F',
  'controller_manager': '\uD83C\uDFAE',
  'ros2_control_node': '\uD83D\uDD27',
  'rviz': '\uD83D\uDC41\uFE0F'
};

function getNodeIcon(nodeId) {
  var name = nodeId.replace(/^\//, '');
  for (var key in NODE_ICONS) {
    if (name.indexOf(key) >= 0) return NODE_ICONS[key];
  }
  return '\u25CF';
}

function isKeyTopic(topicId) {
  return KEY_TOPICS.indexOf(topicId) >= 0;
}

function renderD3Graph(svgEl, data, opts) {
  var svg = d3.select(svgEl);
  svg.selectAll('*').remove();

  var width = svgEl.clientWidth || 800;
  var height = svgEl.clientHeight || 500;

  // Build visible node/edge lists
  var visibleNodes = data.nodes.slice();
  var visibleEdges = data.edges.slice();

  if (opts.showTopics) {
    visibleNodes = visibleNodes.concat(data.topics.map(function(t) { return Object.assign({}, t); }));
  }
  if (opts.showServices) {
    visibleNodes = visibleNodes.concat(data.services.map(function(s) { return Object.assign({}, s); }));
  }

  // Filter by text
  if (opts.filterText) {
    var ft = opts.filterText.toLowerCase();
    var matchIds = {};
    visibleNodes.forEach(function(n) {
      if (n.id.toLowerCase().indexOf(ft) >= 0) matchIds[n.id] = true;
    });
    // Also include nodes connected to matched nodes
    visibleEdges.forEach(function(ed) {
      if (matchIds[ed.source] || matchIds[ed.target]) {
        matchIds[ed.source] = true;
        matchIds[ed.target] = true;
      }
    });
    visibleNodes = visibleNodes.filter(function(n) { return matchIds[n.id]; });
  }

  // Only edges with both endpoints visible
  var nodeIdSet = {};
  visibleNodes.forEach(function(n) { nodeIdSet[n.id] = true; });
  visibleEdges = visibleEdges.filter(function(ed) {
    return nodeIdSet[ed.source] && nodeIdSet[ed.target];
  });

  if (visibleNodes.length === 0) return;

  // Defs: arrow markers
  var defs = svg.append('defs');
  var markerColors = { publishes: '#E8A020', subscribes: '#26A69A', serves: '#AB47BC' };
  Object.keys(markerColors).forEach(function(type) {
    defs.append('marker')
      .attr('id', 'arrow-' + type)
      .attr('viewBox', '0 0 10 6').attr('refX', 10).attr('refY', 3)
      .attr('markerWidth', 8).attr('markerHeight', 6)
      .attr('orient', 'auto')
      .append('path').attr('d', 'M0,0 L10,3 L0,6 Z').attr('fill', markerColors[type]);
  });

  // Zoom
  var g = svg.append('g').attr('class', 'zoom-group');
  var zoom = d3.zoom()
    .scaleExtent([0.1, 4])
    .on('zoom', function(event) {
      g.attr('transform', event.transform);
      opts.transformRef.current = event.transform;
      updateMinimap();
    });
  svg.call(zoom);

  // Restore previous transform
  if (opts.transformRef.current) {
    svg.call(zoom.transform, opts.transformRef.current);
  }

  // Force simulation
  var simNodes = visibleNodes.map(function(n) { return Object.assign({}, n); });
  var simEdges = visibleEdges.map(function(ed) { return { source: ed.source, target: ed.target, type: ed.type }; });

  var simulation = d3.forceSimulation(simNodes)
    .force('link', d3.forceLink(simEdges).id(function(d) { return d.id; }).distance(140))
    .force('charge', d3.forceManyBody().strength(-350))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(50))
    .force('x', d3.forceX(width / 2).strength(0.05))
    .force('y', d3.forceY(height / 2).strength(0.05));

  opts.simRef.current = simulation;

  // Pre-tick for stable layout
  simulation.alpha(1);
  for (var i = 0; i < 300; i++) simulation.tick();
  simulation.alpha(0).stop();

  // Edges
  var edgeGroup = g.append('g').attr('class', 'edges');
  var links = edgeGroup.selectAll('path')
    .data(simEdges).enter().append('path')
    .attr('stroke', function(d) { return markerColors[d.type] || '#555'; })
    .attr('stroke-width', 1.5)
    .attr('fill', 'none')
    .attr('opacity', 0.5)
    .attr('marker-end', function(d) { return 'url(#arrow-' + d.type + ')'; });

  // Nodes
  var nodeGroup = g.append('g').attr('class', 'nodes');
  var nodeGs = nodeGroup.selectAll('g')
    .data(simNodes).enter().append('g')
    .attr('cursor', 'pointer')
    .call(d3.drag()
      .on('start', function(event, d) { d.fx = d.x; d.fy = d.y; })
      .on('drag', function(event, d) { d.fx = event.x; d.fy = event.y; updatePositions(); })
      .on('end', function(event, d) { d.fx = null; d.fy = null; })
    );

  // Draw shapes per type
  nodeGs.each(function(d) {
    var el = d3.select(this);
    if (d.type === 'node') {
      // Rounded rect with left accent bar
      el.append('rect')
        .attr('rx', 6).attr('ry', 6)
        .attr('width', 160).attr('height', 36)
        .attr('x', -80).attr('y', -18)
        .attr('fill', '#242424').attr('stroke', '#2E2E2E').attr('stroke-width', 1);
      // Left accent bar
      el.append('rect')
        .attr('width', 3).attr('height', 28)
        .attr('x', -80).attr('y', -14)
        .attr('rx', 1.5).attr('fill', '#E8A020');
      // Icon
      el.append('text')
        .attr('x', -68).attr('dy', '0.35em')
        .attr('font-size', '12px')
        .text(getNodeIcon(d.id));
      // Label
      el.append('text')
        .attr('x', -54).attr('dy', '0.35em')
        .attr('fill', '#E0E0E0').attr('font-size', '11px').attr('font-family', 'Inter, sans-serif')
        .text(d.id.length > 18 ? d.id.slice(0, 17) + '\u2026' : d.id);
    } else if (d.type === 'topic') {
      var isKey = isKeyTopic(d.id);
      el.append('rect')
        .attr('rx', 12).attr('ry', 12)
        .attr('width', 140).attr('height', 28)
        .attr('x', -70).attr('y', -14)
        .attr('fill', isKey ? 'rgba(232,160,32,0.08)' : '#1A2A1A')
        .attr('stroke', isKey ? '#E8A020' : '#2E4A2E').attr('stroke-width', 1);
      el.append('text')
        .attr('text-anchor', 'middle').attr('dy', '0.35em')
        .attr('fill', isKey ? '#E8A020' : '#80C080')
        .attr('font-size', '10px').attr('font-family', 'JetBrains Mono, monospace')
        .text(d.id.length > 18 ? d.id.slice(0, 17) + '\u2026' : d.id);
    } else if (d.type === 'service') {
      el.append('rect')
        .attr('rx', 12).attr('ry', 12)
        .attr('width', 120).attr('height', 24)
        .attr('x', -60).attr('y', -12)
        .attr('fill', 'rgba(171,71,188,0.08)')
        .attr('stroke', '#7B1FA2').attr('stroke-width', 1);
      el.append('text')
        .attr('text-anchor', 'middle').attr('dy', '0.35em')
        .attr('fill', '#CE93D8')
        .attr('font-size', '9px').attr('font-family', 'JetBrains Mono, monospace')
        .text(d.id.length > 16 ? d.id.slice(0, 15) + '\u2026' : d.id);
    }
  });

  // Hover: highlight connected, fade others
  nodeGs.on('mouseover', function(event, d) {
    var connectedIds = {};
    connectedIds[d.id] = true;
    simEdges.forEach(function(ed) {
      var sid = typeof ed.source === 'object' ? ed.source.id : ed.source;
      var tid = typeof ed.target === 'object' ? ed.target.id : ed.target;
      if (sid === d.id) connectedIds[tid] = true;
      if (tid === d.id) connectedIds[sid] = true;
    });
    nodeGs.transition().duration(150).attr('opacity', function(n) { return connectedIds[n.id] ? 1 : 0.15; });
    links.transition().duration(150).attr('opacity', function(ed) {
      var sid = typeof ed.source === 'object' ? ed.source.id : ed.source;
      var tid = typeof ed.target === 'object' ? ed.target.id : ed.target;
      return (sid === d.id || tid === d.id) ? 0.9 : 0.04;
    }).attr('stroke-width', function(ed) {
      var sid = typeof ed.source === 'object' ? ed.source.id : ed.source;
      var tid = typeof ed.target === 'object' ? ed.target.id : ed.target;
      return (sid === d.id || tid === d.id) ? 2.5 : 1.5;
    });

    // Tooltip
    var tooltip = d3.select(svgEl.parentNode.parentNode).select('.ros2-graph-tooltip');
    if (!tooltip.empty()) {
      var info = '';
      if (d.type === 'node') {
        var pubs = 0, subs = 0, srvs = 0;
        simEdges.forEach(function(ed) {
          var sid = typeof ed.source === 'object' ? ed.source.id : ed.source;
          var tid = typeof ed.target === 'object' ? ed.target.id : ed.target;
          if (sid === d.id && ed.type === 'publishes') pubs++;
          if (tid === d.id && ed.type === 'subscribes') subs++;
          if (sid === d.id && ed.type === 'serves') srvs++;
        });
        info = 'Publishers: ' + pubs + ' | Subscribers: ' + subs + ' | Services: ' + srvs;
      } else if (d.type === 'topic') {
        info = 'Type: ' + (d.msg_type || 'unknown');
      } else {
        info = 'Type: ' + (d.srv_type || 'unknown');
      }
      tooltip.style('display', 'block')
        .style('left', (event.offsetX + 12) + 'px')
        .style('top', (event.offsetY - 10) + 'px');
      tooltip.select('.ros2-graph-tooltip__name').text(d.id);
      tooltip.select('.ros2-graph-tooltip__row').text(info);
    }
  }).on('mouseout', function() {
    nodeGs.transition().duration(150).attr('opacity', 1);
    links.transition().duration(150).attr('opacity', 0.5).attr('stroke-width', 1.5);
    d3.select(svgEl.parentNode.parentNode).select('.ros2-graph-tooltip').style('display', 'none');
  });

  // Click: detail panel
  nodeGs.on('click', function(event, d) {
    event.stopPropagation();
    var detail = { id: d.id, type: d.type, msg_type: d.msg_type || '', srv_type: d.srv_type || '', publishers: [], subscribers: [], services: [] };
    simEdges.forEach(function(ed) {
      var sid = typeof ed.source === 'object' ? ed.source.id : ed.source;
      var tid = typeof ed.target === 'object' ? ed.target.id : ed.target;
      if (ed.type === 'publishes' && sid === d.id) detail.publishers.push(tid);
      if (ed.type === 'publishes' && tid === d.id) detail.publishers.push(sid);
      if (ed.type === 'subscribes' && tid === d.id) detail.subscribers.push(sid);
      if (ed.type === 'subscribes' && sid === d.id) detail.subscribers.push(tid);
      if (ed.type === 'serves' && sid === d.id) detail.services.push(tid);
      if (ed.type === 'serves' && tid === d.id) detail.services.push(sid);
    });
    opts.setSelected(detail);
  });

  // Click background to deselect
  svg.on('click', function() { opts.setSelected(null); });

  // Position update function
  function updatePositions() {
    links.attr('d', function(d) {
      var sx = d.source.x, sy = d.source.y, tx = d.target.x, ty = d.target.y;
      var dx = tx - sx, dy = ty - sy;
      var dr = Math.sqrt(dx * dx + dy * dy) * 0.6;
      return 'M' + sx + ',' + sy + 'A' + dr + ',' + dr + ' 0 0,1 ' + tx + ',' + ty;
    });
    nodeGs.attr('transform', function(d) { return 'translate(' + d.x + ',' + d.y + ')'; });
  }

  updatePositions();

  // Minimap
  function updateMinimap() {
    var mm = d3.select(svgEl.parentNode.parentNode).select('.ros2-minimap svg');
    if (mm.empty()) return;
    mm.selectAll('*').remove();
    var ext = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
    simNodes.forEach(function(n) {
      if (n.x < ext.x0) ext.x0 = n.x;
      if (n.y < ext.y0) ext.y0 = n.y;
      if (n.x > ext.x1) ext.x1 = n.x;
      if (n.y > ext.y1) ext.y1 = n.y;
    });
    var pad = 40;
    ext.x0 -= pad; ext.y0 -= pad; ext.x1 += pad; ext.y1 += pad;
    var gw = ext.x1 - ext.x0 || 1, gh = ext.y1 - ext.y0 || 1;
    var mw = 100, mh = 75;
    var sx = mw / gw, sy = mh / gh, s = Math.min(sx, sy);

    // Draw mini nodes
    simNodes.forEach(function(n) {
      var color = n.type === 'node' ? '#E8A020' : n.type === 'topic' ? '#4CAF50' : '#AB47BC';
      mm.append('circle')
        .attr('cx', (n.x - ext.x0) * s)
        .attr('cy', (n.y - ext.y0) * s)
        .attr('r', 2).attr('fill', color);
    });

    // Draw viewport rect
    var t = opts.transformRef.current || d3.zoomIdentity;
    var vx = -t.x / t.k, vy = -t.y / t.k, vw = width / t.k, vh = height / t.k;
    mm.append('rect')
      .attr('x', (vx - ext.x0) * s).attr('y', (vy - ext.y0) * s)
      .attr('width', vw * s).attr('height', vh * s)
      .attr('fill', 'none').attr('stroke', '#E8A020').attr('stroke-width', 1).attr('opacity', 0.7);
  }
  updateMinimap();

  // Store fitView function
  opts.fitViewRef.current = function() {
    var ext = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
    simNodes.forEach(function(n) {
      if (n.x < ext.x0) ext.x0 = n.x;
      if (n.y < ext.y0) ext.y0 = n.y;
      if (n.x > ext.x1) ext.x1 = n.x;
      if (n.y > ext.y1) ext.y1 = n.y;
    });
    var pad = 60;
    var gw = (ext.x1 - ext.x0 + pad * 2) || 1;
    var gh = (ext.y1 - ext.y0 + pad * 2) || 1;
    var scale = Math.min(width / gw, height / gh, 2);
    var cx = (ext.x0 + ext.x1) / 2, cy = (ext.y0 + ext.y1) / 2;
    var t = d3.zoomIdentity.translate(width / 2 - cx * scale, height / 2 - cy * scale).scale(scale);
    svg.transition().duration(500).call(zoom.transform, t);
  };

  opts.resetZoomRef.current = function() {
    svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity);
  };
}

function RobotROS2Tab(props) {
  var graphState = useState(null);
  var graphData = graphState[0];
  var setGraphData = graphState[1];

  var selectedState = useState(null);
  var selected = selectedState[0];
  var setSelected = selectedState[1];

  var filterState = useState('');
  var filterText = filterState[0];
  var setFilterText = filterState[1];

  var showTopicsState = useState(true);
  var showTopics = showTopicsState[0];
  var setShowTopics = showTopicsState[1];

  var showServicesState = useState(false);
  var showServices = showServicesState[0];
  var setShowServices = showServicesState[1];

  var lastUpdatedState = useState(null);
  var lastUpdated = lastUpdatedState[0];
  var setLastUpdated = lastUpdatedState[1];

  var svgRef = useRef(null);
  var simRef = useRef(null);
  var transformRef = useRef(null);
  var fitViewRef = useRef(null);
  var resetZoomRef = useRef(null);

  // Fetch graph data every 5 seconds
  useEffect(function() {
    function fetchGraph() {
      authFetch('/api/ros2/graph')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          setGraphData(d);
          setLastUpdated(new Date().toLocaleTimeString());
        })
        .catch(function() {});
    }
    fetchGraph();
    var interval = setInterval(fetchGraph, 5000);
    return function() { clearInterval(interval); };
  }, []);

  // Render D3 graph when data or options change
  useEffect(function() {
    if (!graphData || !graphData.online || !svgRef.current) return;
    renderD3Graph(svgRef.current, graphData, {
      showTopics: showTopics,
      showServices: showServices,
      filterText: filterText,
      transformRef: transformRef,
      simRef: simRef,
      fitViewRef: fitViewRef,
      resetZoomRef: resetZoomRef,
      setSelected: setSelected
    });
  }, [graphData, showTopics, showServices, filterText]);

  // Offline state
  if (graphData && !graphData.online) {
    return e('div', { className: 'ros2-offline' },
      e('div', { className: 'ros2-offline__box' },
        e('div', { className: 'ros2-offline__dot' }),
        e('div', { className: 'ros2-offline__title' }, 'ROS2 OFFLINE'),
        e('div', { className: 'ros2-offline__sub' }, 'Start robot stack to visualize node graph'),
        e('a', { className: 'ros2-offline__link', href: '#' }, 'View Documentation')
      )
    );
  }

  // Loading state

// SVG Arc Gauge component for joint display
function JointArcGauge(props) {
  var value = props.value || 0;
  var min = props.min || -3.14;
  var max = props.max || 3.14;
  var label = props.label || '';
  var size = props.size || 80;
  var r = (size - 8) / 2;
  var cx = size / 2;
  var cy = size / 2;

  var range = max - min;
  var normalized = Math.max(0, Math.min(1, (value - min) / range));
  var startAngle = -135 * (Math.PI / 180);
  var endAngle = 135 * (Math.PI / 180);
  var sweep = endAngle - startAngle;
  var angle = startAngle + normalized * sweep;

  // Track arc
  var trackD = describeArc(cx, cy, r, startAngle, endAngle);
  // Value arc
  var valueD = describeArc(cx, cy, r, startAngle, angle);
  // Needle endpoint
  var nx = cx + (r - 6) * Math.cos(angle);
  var ny = cy + (r - 6) * Math.sin(angle);

  var pct = normalized * 100;
  var color = pct > 85 ? 'var(--danger)' : pct > 60 ? 'var(--warning)' : 'var(--accent)';
  var degValue = (value * 180 / Math.PI).toFixed(1);

  return e('div', { className: 'joint-gauge' },
    e('div', { className: 'joint-gauge__label' }, label),
    e('svg', { width: size, height: size * 0.75, viewBox: '0 0 ' + size + ' ' + (size * 0.75) },
      e('path', { d: trackD, fill: 'none', stroke: 'var(--border)', strokeWidth: 4, strokeLinecap: 'round' }),
      e('path', { d: valueD, fill: 'none', stroke: color, strokeWidth: 4, strokeLinecap: 'round' }),
      e('circle', { cx: nx, cy: ny, r: 3, fill: color }),
      e('text', { x: cx, y: cy + 2, textAnchor: 'middle', fill: 'var(--text)', fontSize: '12', fontFamily: 'var(--font-mono)', fontWeight: 700 }, degValue + '\u00B0')
    ),
    e('div', { className: 'joint-gauge__sub' },
      (min * 180 / Math.PI).toFixed(0) + '\u00B0 / ' + (max * 180 / Math.PI).toFixed(0) + '\u00B0'
    )
  );
}

function describeArc(cx, cy, r, startAngle, endAngle) {
  var x1 = cx + r * Math.cos(startAngle);
  var y1 = cy + r * Math.sin(startAngle);
  var x2 = cx + r * Math.cos(endAngle);
  var y2 = cy + r * Math.sin(endAngle);
  var largeArc = (endAngle - startAngle > Math.PI) ? 1 : 0;
  return 'M ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + x2 + ' ' + y2;
}

// Three.js 3D Robot Viewer — loads actual CR10 STL meshes with FK chain
function ThreeJSViewer(props) {
  var containerRef = useRef(null);
  var sceneRef = useRef(null);
  var rendererRef = useRef(null);
  var jointGroupsRef = useRef([]);
  var targetAnglesRef = useRef([0, 0, 0, 0, 0, 0]);
  var frameRef = useRef(null);
  var workspaceRef = useRef(null);
  var axesRef = useRef(null);
  var cameraPayloadRef = useRef(null);

  var loadState = useState(true);
  var loading = loadState[0];
  var setLoading = loadState[1];
  var loadMsgState = useState('Loading CR10 meshes...');
  var loadMsg = loadMsgState[0];
  var setLoadMsg = loadMsgState[1];
  var viewState = useState('home');
  var currentView = viewState[0];
  var setCurrentView = viewState[1];
  var wsState = useState(true);
  var showWorkspace = wsState[0];
  var setShowWorkspace = wsState[1];
  var axState = useState(true);
  var showAxesToggle = axState[0];
  var setShowAxesToggle = axState[1];

  var online = props.online;
  var joints = props.joints || [];
  var cameraPayload = props.cameraPayload;

  // CR10 URDF joint configs
  var JOINTS = [
    { origin: [0, 0, 0.1765], axis: 'z' },   // J1 base rotation
    { origin: [0, 0.0055, 0], axis: 'y' },    // J2 shoulder
    { origin: [0, 0, 0.607], axis: 'y' },     // J3 elbow
    { origin: [0, 0, 0.568], axis: 'x' },     // J4 wrist 1
    { origin: [0, 0, 0.191], axis: 'y' },     // J5 wrist 2
    { origin: [0, 0, 0.125], axis: 'x' },     // J6 flange
  ];

  // Binary STL parser
  function parseSTLBinary(buffer) {
    var dv = new DataView(buffer);
    var offset = 80;
    var triCount = dv.getUint32(offset, true);
    offset += 4;
    var positions = new Float32Array(triCount * 9);
    var normals = new Float32Array(triCount * 9);
    for (var i = 0; i < triCount; i++) {
      var nx = dv.getFloat32(offset, true);
      var ny = dv.getFloat32(offset + 4, true);
      var nz = dv.getFloat32(offset + 8, true);
      offset += 12;
      for (var j = 0; j < 3; j++) {
        var idx = i * 9 + j * 3;
        positions[idx] = dv.getFloat32(offset, true);
        positions[idx + 1] = dv.getFloat32(offset + 4, true);
        positions[idx + 2] = dv.getFloat32(offset + 8, true);
        normals[idx] = nx; normals[idx + 1] = ny; normals[idx + 2] = nz;
        offset += 12;
      }
      offset += 2;
    }
    var geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geom.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    return geom;
  }

  // Initialize scene once
  useEffect(function() {
    if (!containerRef.current || typeof THREE === 'undefined') return;
    var container = containerRef.current;
    var w = container.clientWidth;
    var h = container.clientHeight;

    try {
      var tc = document.createElement('canvas');
      var gl = tc.getContext('webgl') || tc.getContext('experimental-webgl');
      if (!gl) throw new Error('No WebGL');
    } catch(ex) {
      container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#808080;">3D requires WebGL</div>';
      return;
    }

    try {

    // Scene
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0F0F0F);
    scene.fog = new THREE.Fog(0x0F0F0F, 5, 12);
    sceneRef.current = scene;

    // Camera
    var camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);

    // Renderer
    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);
    rendererRef.current = renderer;

    // Lights
    scene.add(new THREE.AmbientLight(0x404040, 0.5));
    var dirLight = new THREE.DirectionalLight(0xFFFFFF, 0.8);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);
    var rimLight = new THREE.DirectionalLight(0xE8A020, 0.3);
    rimLight.position.set(-2, 3, -2);
    scene.add(rimLight);

    // Grid & Axes
    scene.add(new THREE.GridHelper(4, 20, 0x2E2E2E, 0x1A1A1A));
    var axesHelper = new THREE.AxesHelper(0.3);
    axesHelper.position.set(-1.5, 0, -1.5);
    scene.add(axesHelper);
    axesRef.current = axesHelper;

    // Workspace sphere at J1 height
    var wsSphereGeom = new THREE.SphereGeometry(1.3, 32, 16);
    var wsSphereMat = new THREE.MeshBasicMaterial({ color: 0xE8A020, wireframe: true, transparent: true, opacity: 0.05 });
    var wsSphere = new THREE.Mesh(wsSphereGeom, wsSphereMat);
    wsSphere.position.set(0, 0.1765, 0);
    scene.add(wsSphere);
    workspaceRef.current = wsSphere;

    // Materials
    var linkMat = new THREE.MeshPhongMaterial({ color: 0x2A2A2A, specular: 0x444444, shininess: 30 });
    var baseMat = new THREE.MeshPhongMaterial({ color: 0xE8A020, emissive: 0x4A3000, shininess: 60 });
    var eeMat = new THREE.MeshPhongMaterial({ color: 0xE8A020, emissive: 0x6A4000, shininess: 80 });
    var matMap = [baseMat, linkMat, linkMat, linkMat, linkMat, linkMat, eeMat];

    // Root group: convert URDF Z-up to Three.js Y-up
    var rootGroup = new THREE.Group();
    rootGroup.rotation.x = -Math.PI / 2;
    scene.add(rootGroup);

    var jointGroups = [];

    // Fallback: cylinder primitives if STL loading fails
    function buildFallbackRobot() {
      var linkDefs = [
        { h: 0.08, r: 0.12 },
        { h: 0.10, r: 0.055 }, { h: 0.607, r: 0.045 },
        { h: 0.568, r: 0.04 }, { h: 0.191, r: 0.035 },
        { h: 0.125, r: 0.03 }, { h: 0.1084, r: 0.025 },
      ];
      // Base cylinder
      var baseGeom = new THREE.CylinderGeometry(0.12, 0.14, 0.08, 32);
      var baseCyl = new THREE.Mesh(baseGeom, baseMat);
      baseCyl.rotation.x = Math.PI / 2;
      baseCyl.position.set(0, 0, 0.04);
      rootGroup.add(baseCyl);

      var parent = rootGroup;
      for (var i = 0; i < JOINTS.length; i++) {
        var jg = new THREE.Group();
        jg.position.set(JOINTS[i].origin[0], JOINTS[i].origin[1], JOINTS[i].origin[2]);
        parent.add(jg);
        jointGroups.push(jg);
        var cyl = new THREE.CylinderGeometry(linkDefs[i + 1].r, linkDefs[i + 1].r, linkDefs[i + 1].h, 16);
        var mesh = new THREE.Mesh(cyl, matMap[i + 1]);
        mesh.rotation.x = Math.PI / 2;
        mesh.position.set(0, 0, linkDefs[i + 1].h / 2);
        jg.add(mesh);
        parent = jg;
      }
      jointGroupsRef.current = jointGroups;
    }

    // Build kinematic chain from loaded STL geometries
    function buildKinematicChain(meshList, geometries) {
      var linkNames = ['base_link', 'link_1', 'link_2', 'link_3', 'link_4', 'link_5', 'link_6'];
      if (geometries.base_link) {
        var bm = new THREE.Mesh(geometries.base_link, matMap[0]);
        rootGroup.add(bm);
      }
      var parent = rootGroup;
      for (var i = 0; i < JOINTS.length; i++) {
        var jg = new THREE.Group();
        jg.position.set(JOINTS[i].origin[0], JOINTS[i].origin[1], JOINTS[i].origin[2]);
        parent.add(jg);
        jointGroups.push(jg);
        var linkName = linkNames[i + 1];
        if (geometries[linkName]) {
          var lm = new THREE.Mesh(geometries[linkName], matMap[i + 1]);
          jg.add(lm);
        }
        parent = jg;
      }
      jointGroupsRef.current = jointGroups;
      // End effector cone
      var eeGeom = new THREE.ConeGeometry(0.015, 0.04, 8);
      var eeCone = new THREE.Mesh(eeGeom, eeMat);
      eeCone.position.set(0, 0, 0.06);
      parent.add(eeCone);
    }

    // Load STL meshes
    (function loadMeshes() {
      authFetch('/api/robot/dobot_cr10/meshes')
        .then(function(r) { return r.json(); })
        .then(function(meshList) {
          setLoadMsg('Loading STL files... 0/' + meshList.length);
          var loaded = 0;
          var meshGeometries = {};
          function loadNext(idx) {
            if (idx >= meshList.length) {
              buildKinematicChain(meshList, meshGeometries);
              setLoading(false);
              return;
            }
            var m = meshList[idx];
            authFetch('/static/meshes/' + m.visual_path)
              .then(function(r) { return r.arrayBuffer(); })
              .then(function(buf) {
                meshGeometries[m.link_name] = parseSTLBinary(buf);
                loaded++;
                setLoadMsg('Loading STL files... ' + loaded + '/' + meshList.length);
                loadNext(idx + 1);
              })
              .catch(function(err) {
                console.error('Failed to load ' + m.visual_path, err);
                loaded++;
                loadNext(idx + 1);
              });
          }
          loadNext(0);
        })
        .catch(function(err) {
          console.error('Mesh metadata fetch failed, using fallback', err);
          setLoadMsg('Using fallback geometry...');
          buildFallbackRobot();
          setLoading(false);
        });
    })();

    // Orbit controls
    var isDragging = false;
    var prevMouse = { x: 0, y: 0 };
    var spherical = { theta: Math.PI / 4, phi: Math.PI / 4, radius: 3 };
    function updateCam() {
      camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
      camera.position.y = spherical.radius * Math.cos(spherical.phi);
      camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
      camera.lookAt(0, 0.5, 0);
    }
    updateCam();
    container._spherical = spherical;
    container._updateCamera = updateCam;

    function onDown(ev) { isDragging = true; prevMouse = { x: ev.clientX, y: ev.clientY }; }
    function onUp() { isDragging = false; }
    function onMove(ev) {
      if (!isDragging) return;
      var dx = ev.clientX - prevMouse.x;
      var dy = ev.clientY - prevMouse.y;
      spherical.theta -= dx * 0.005;
      spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi + dy * 0.005));
      updateCam();
      prevMouse = { x: ev.clientX, y: ev.clientY };
    }
    function onWheel(ev) {
      ev.preventDefault();
      spherical.radius = Math.max(0.3, Math.min(5, spherical.radius + ev.deltaY * 0.003));
      updateCam();
    }
    renderer.domElement.addEventListener('mousedown', onDown);
    renderer.domElement.addEventListener('mouseup', onUp);
    renderer.domElement.addEventListener('mousemove', onMove);
    renderer.domElement.addEventListener('wheel', onWheel, { passive: false });

    // Render loop (30fps cap)
    var lastTime = 0;
    function animate(time) {
      frameRef.current = requestAnimationFrame(animate);
      if (document.hidden) return;
      if (time - lastTime < 33) return;
      lastTime = time;
      // Lerp joint angles
      var jgs = jointGroupsRef.current;
      var targets = targetAnglesRef.current;
      for (var j = 0; j < jgs.length; j++) {
        var target = (targets[j] || 0) * Math.PI / 180;
        var ax = JOINTS[j].axis;
        if (ax === 'z') { jgs[j].rotation.z += (target - jgs[j].rotation.z) * 0.15; }
        else if (ax === 'y') { jgs[j].rotation.y += (target - jgs[j].rotation.y) * 0.15; }
        else if (ax === 'x') { jgs[j].rotation.x += (target - jgs[j].rotation.x) * 0.15; }
      }
      renderer.render(scene, camera);
    }
    animate(0);

    // Resize
    function onResize() {
      var nw = container.clientWidth;
      var nh = container.clientHeight;
      if (nw === 0 || nh === 0) return;
      camera.aspect = nw / nh;
      camera.updateProjectionMatrix();
      renderer.setSize(nw, nh);
    }
    window.addEventListener('resize', onResize);

    return function() {
      window.removeEventListener('resize', onResize);
      renderer.domElement.removeEventListener('mousedown', onDown);
      renderer.domElement.removeEventListener('mouseup', onUp);
      renderer.domElement.removeEventListener('mousemove', onMove);
      renderer.domElement.removeEventListener('wheel', onWheel);
      if (frameRef.current) cancelAnimationFrame(frameRef.current);
      if (renderer.domElement.parentNode) container.removeChild(renderer.domElement);
      scene.traverse(function(obj) {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(function(m) { m.dispose(); });
          else obj.material.dispose();
        }
      });
      renderer.dispose();
    };

    } catch(_webglErr) {
      container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#808080;font-size:12px;text-align:center;padding:20px;">3D Error<br><span style="font-size:10px;color:#555;">' + _webglErr.message + '</span></div>';
      return;
    }
  }, []);

  // Update target joint angles from props
  useEffect(function() {
    if (!joints.length) return;
    var angles = [];
    for (var i = 0; i < 6; i++) {
      angles.push(joints[i] ? (joints[i].position || 0) : 0);
    }
    targetAnglesRef.current = angles;
  }, [joints]);

  // Toggle workspace visibility
  useEffect(function() {
    if (workspaceRef.current) workspaceRef.current.visible = showWorkspace;
  }, [showWorkspace]);

  // Toggle axes visibility
  useEffect(function() {
    if (axesRef.current) axesRef.current.visible = showAxesToggle;
  }, [showAxesToggle]);

  // Camera payload visualization at end effector
  useEffect(function() {
    if (cameraPayloadRef.current) {
      var old = cameraPayloadRef.current;
      if (old.parent) old.parent.remove(old);
      old.traverse(function(c) { if (c.geometry) c.geometry.dispose(); if (c.material) c.material.dispose(); });
      cameraPayloadRef.current = null;
    }
    if (!cameraPayload || !jointGroupsRef.current.length) return;
    var eeGroup = jointGroupsRef.current[jointGroupsRef.current.length - 1];
    var payloadGroup = new THREE.Group();
    payloadGroup.position.set(0, 0, 0.11);
    // Camera body
    var cw = (cameraPayload.dims_mm ? cameraPayload.dims_mm.w : 114) / 1000;
    var ch = (cameraPayload.dims_mm ? cameraPayload.dims_mm.h : 58) / 1000;
    var cl = (cameraPayload.dims_mm ? cameraPayload.dims_mm.l : 130) / 1000;
    var camGeom = new THREE.BoxGeometry(cw, ch, cl);
    var camMat = new THREE.MeshPhongMaterial({ color: 0x1A3A5A, specular: 0x333366, shininess: 40 });
    var camMesh = new THREE.Mesh(camGeom, camMat);
    camMesh.position.set(0, 0, cl / 2);
    payloadGroup.add(camMesh);
    // Lens
    var ll = (cameraPayload.lens_length_mm || 128) / 1000;
    var ld = (cameraPayload.lens_diameter_mm || 95) / 1000;
    var lensGeom = new THREE.CylinderGeometry(ld / 2, ld / 2, ll, 16);
    var lensMat = new THREE.MeshPhongMaterial({ color: 0x2A2A2A, specular: 0x333333, shininess: 30 });
    var lensMesh = new THREE.Mesh(lensGeom, lensMat);
    lensMesh.rotation.x = Math.PI / 2;
    lensMesh.position.set(0, 0, cl + ll / 2);
    payloadGroup.add(lensMesh);
    eeGroup.add(payloadGroup);
    cameraPayloadRef.current = payloadGroup;
  }, [cameraPayload]);

  function setView(name) {
    setCurrentView(name);
    var sp = containerRef.current && containerRef.current._spherical;
    var upd = containerRef.current && containerRef.current._updateCamera;
    if (!sp || !upd) return;
    if (name === 'home') { sp.theta = Math.PI / 4; sp.phi = Math.PI / 4; sp.radius = 3; }
    else if (name === 'front') { sp.theta = 0; sp.phi = Math.PI / 3; sp.radius = 3; }
    else if (name === 'side') { sp.theta = Math.PI / 2; sp.phi = Math.PI / 3; sp.radius = 3; }
    else if (name === 'top') { sp.theta = 0; sp.phi = 0.15; sp.radius = 3.5; }
    else if (name === 'iso') { sp.theta = Math.PI / 5; sp.phi = Math.PI / 5; sp.radius = 2.5; }
    upd();
  }

  return e('div', { className: 'threejs-viewer', ref: containerRef },
    !online ? e('div', { className: 'threejs-viewer__offline' },
      e('div', { className: 'threejs-viewer__offline-text' }, 'ROBOT OFFLINE')
    ) : null,
    loading ? e('div', { style: { position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%,-50%)', color: '#E8A020', textAlign: 'center', zIndex: 10 } },
      e('div', { style: { fontSize: '32px', animation: 'pulse 2s infinite' } }, '\u03B1'),
      e('div', { style: { fontSize: '12px', color: '#808080', marginTop: '8px' } }, loadMsg)
    ) : null,
    e('div', { className: 'threejs-viewer__overlay' },
      ['home', 'front', 'side', 'top', 'iso'].map(function(v) {
        return e('button', {
          key: v,
          className: 'threejs-viewer__btn' + (currentView === v ? ' threejs-viewer__btn--active' : ''),
          onClick: function() { setView(v); }
        }, v === 'home' ? '\u2299' : v.toUpperCase());
      })
    ),
    e('div', { style: { position: 'absolute', bottom: '8px', right: '8px', display: 'flex', flexDirection: 'column', gap: '4px', zIndex: 10 } },
      e('label', { style: { fontSize: '10px', color: '#808080', cursor: 'pointer', display: 'flex', alignItems: 'center' } },
        e('input', { type: 'checkbox', checked: showWorkspace, onChange: function() { setShowWorkspace(function(p) { return !p; }); }, style: { marginRight: '4px' } }), 'Workspace'),
      e('label', { style: { fontSize: '10px', color: '#808080', cursor: 'pointer', display: 'flex', alignItems: 'center' } },
        e('input', { type: 'checkbox', checked: showAxesToggle, onChange: function() { setShowAxesToggle(function(p) { return !p; }); }, style: { marginRight: '4px' } }), 'Axes')
    )
  );
}

// Simulation Mode Panel

  var stState = useState({ running: false, mode: 'STANDALONE', uptime: 0, pid: null });
  var simStatus = stState[0]; var setSimStatus = stState[1];

  function fetchStatus() {
    authFetch('/api/simulation/status')
      .then(function(r) { return r.json(); })
      .then(setSimStatus)
      .catch(function() {});
  }

  useEffect(function() {
    fetchStatus();
    var iv = setInterval(fetchStatus, 3000);
    return function() { clearInterval(iv); };
  }, []);

  function changeMode(mode) {
    authFetch('/api/robot/dobot_cr10/twin/mode', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: mode })
    }).then(function() { fetchStatus(); }).catch(function() {});
  }

  function toggleSim() {
    var endpoint = simStatus.running ? '/api/simulation/stop' : '/api/simulation/start';

  var modeDescs = {

  var upStr = '';

  var ss = { label: { fontSize: '10px', textTransform: 'uppercase', letterSpacing: '1px', color: '#808080' } };

            background: active ? '#E8A020' : '#1a1a1a', color: active ? '#0a0a0a' : '#808080', transition: 'all 150ms' }
        }, mode);
      })

    // Mode description
    e('div', { style: { fontSize: '11px', color: '#808080', marginBottom: '12px' } }, modeDescs[simStatus.mode] || ''),

        e('span', { style: { color: simStatus.running ? '#4CAF50' : '#808080' } }, simStatus.running ? 'RUNNING' : 'STOPPED')
      ),
      e('div', { style: { display: 'flex', alignItems: 'center', gap: '4px' } },
        e('span', { style: { display: 'inline-block', width: '8px', height: '8px', borderRadius: '50%', background: '#555' } }),
        e('span', { style: { color: '#808080' } }, 'OFFLINE')

// Node Graph Panel (slide-in)
function CockpitNodeGraphPanel(props) {
  var open = props.open;
  var onClose = props.onClose;

  var tabState = useState('nodes');
  var activeTab = tabState[0];
  var setActiveTab = tabState[1];

  var graphState = useState(null);
  var graphData = graphState[0];
  var setGraphData = graphState[1];

  var svgRef = useRef(null);
  var simRef = useRef(null);
  var transformRef = useRef(null);
  var fitViewRef = useRef(null);
  var resetZoomRef = useRef(null);

  // Fetch graph when opened
  useEffect(function() {
    if (!open) return;
    authFetch('/api/ros2/graph')
      .then(function(r) { return r.json(); })
      .then(setGraphData)
      .catch(function() {});
    var interval = setInterval(function() {
      authFetch('/api/ros2/graph')
        .then(function(r) { return r.json(); })
        .then(setGraphData)
        .catch(function() {});
    }, 5000);
    return function() { clearInterval(interval); };
  }, [open]);

  // Render D3 graph
  useEffect(function() {
    if (!graphData || !graphData.online || !svgRef.current || activeTab !== 'nodes') return;
    renderD3Graph(svgRef.current, graphData, {
      showTopics: true,
      showServices: false,
      filterText: '',
      transformRef: transformRef,
      simRef: simRef,
      fitViewRef: fitViewRef,
      resetZoomRef: resetZoomRef,
      setSelected: function() {}
    });
  }, [graphData, activeTab]);

  // Build TF tree from URDF chain
  function renderTFTree() {
    var urdfChain = props.urdfChain || [];
    if (urdfChain.length === 0) {
      return e('div', { className: 'tf-tree' },
        e('div', { style: { color: 'var(--text-dim)' } }, 'No URDF data loaded')
      );
    }

    var lines = [];
    lines.push(e('div', { key: 'world', className: 'tf-tree__node' },
      e('span', { className: 'tf-tree__name' }, 'world')
    ));
    lines.push(e('div', { key: 'base', className: 'tf-tree__node' },
      e('span', { className: 'tf-tree__indent' }, '\u2514\u2500'),
      e('span', { className: 'tf-tree__name' }, 'base_link')
    ));
    for (var i = 0; i < urdfChain.length; i++) {
      var indent = '';
      for (var d = 0; d < i + 2; d++) { indent += '  '; }
      lines.push(e('div', { key: 'j' + i, className: 'tf-tree__node' },
        e('span', { className: 'tf-tree__indent' }, indent + '\u2514\u2500'),
        e('span', { className: 'tf-tree__arrow' }, urdfChain[i].joint),
        e('span', { className: 'tf-tree__arrow' }, '\u2192'),
        e('span', { className: 'tf-tree__name' }, urdfChain[i].child)
      ));
    }
    return e('div', { className: 'tf-tree' }, lines);
  }

  return e('div', { className: 'node-graph-panel' + (open ? ' node-graph-panel--open' : '') },
    e('div', { className: 'node-graph-panel__header' },
      e('span', { className: 'node-graph-panel__title' }, 'Node Graph'),
      e('span', { className: 'node-graph-panel__close', onClick: onClose }, '\u00D7')
    ),
    e('div', { className: 'node-graph-panel__tabs' },
      e('span', {
        className: 'node-graph-panel__tab' + (activeTab === 'nodes' ? ' node-graph-panel__tab--active' : ''),
        onClick: function() { setActiveTab('nodes'); }
      }, 'NODES'),
      e('span', {
        className: 'node-graph-panel__tab' + (activeTab === 'tf' ? ' node-graph-panel__tab--active' : ''),
        onClick: function() { setActiveTab('tf'); }
      }, 'TF TREE')
    ),
    e('div', { className: 'node-graph-panel__body' },
      activeTab === 'nodes'
        ? e('div', { className: 'node-graph-panel__content' },
            e('div', { className: 'node-graph-panel__svg-wrap' },
              graphData && graphData.online
                ? e('svg', { ref: svgRef })
                : e('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', color: 'var(--text-dim)', fontSize: '12px' } },
                    'ROS2 offline \u2014 no node graph available'
                  )
            )
          )
        : e('div', { className: 'node-graph-panel__content' }, renderTFTree())
    )
  );
}

// Velocity Chart (sparkline for each joint velocity)
function VelocityChart(props) {
  var joints = props.joints || [];
  var historyRef = useRef([]);

  // Accumulate history
  if (joints.length > 0) {
    historyRef.current.push(joints.map(function(j) { return Math.abs(j.velocity || 0); }));
    if (historyRef.current.length > 30) historyRef.current.shift();
  }

  var chartData = historyRef.current.map(function(snapshot, idx) {
    var point = { t: idx };
    for (var i = 0; i < 6; i++) {
      point['j' + (i + 1)] = snapshot[i] || 0;
    }
    return point;
  });

  var COLORS = ['#E8A020', '#4CAF50', '#2196F3', '#FF9800', '#9C27B0', '#F44336'];

  return e('div', { className: 'cockpit-card' },
    e('div', { className: 'cockpit-card__title' }, 'Joint Velocities'),
    e('div', { style: { height: '120px' } },
      chartData.length > 1
        ? e(ResponsiveContainer, { width: '100%', height: 120 },
            e(LineChart, { data: chartData, margin: { top: 4, right: 4, left: 4, bottom: 4 } },
              [0,1,2,3,4,5].map(function(i) {
                return e(Line, { key: i, type: 'monotone', dataKey: 'j' + (i + 1), stroke: COLORS[i], strokeWidth: 1.5, dot: false, isAnimationActive: false });
              })
            )
          )
        : e('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100%', color: 'var(--text-dim)', fontSize: '12px' } }, 'Awaiting data...')
    )
  );
}
